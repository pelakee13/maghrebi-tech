# /etc/nginx/sites-available/maghrebi.tech  (TLS via certbot --nginx -d maghrebi.tech -d www.maghrebi.tech)
server {
    listen 80;
    server_name maghrebi.tech www.maghrebi.tech;
    return 301 https://maghrebi.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.maghrebi.tech;
    ssl_certificate     /etc/letsencrypt/live/maghrebi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maghrebi.tech/privkey.pem;
    return 301 https://maghrebi.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name maghrebi.tech;
    ssl_certificate     /etc/letsencrypt/live/maghrebi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maghrebi.tech/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Immutable build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
